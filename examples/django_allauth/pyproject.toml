[project]
name = "pyevp-example-django-allauth"
version = "0"
description = "django-allauth signup that trusts EVP tokens"
requires-python = ">=3.12"
dependencies = [
    "pyevp[dns,httpx2,django]",
    "django>=6.1",
    "django-allauth>=65",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-django>=4.11",
]

[tool.uv.sources]
pyevp = { workspace = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = ["error"]
