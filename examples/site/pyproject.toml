[project]
name = "pyevp-example-site"
version = "0"
description = "pyevp.dev landing page, relying-party demo and mock email provider"
requires-python = ">=3.12"
dependencies = [
    "pyevp[dns,httpx2]",
    "fastapi>=0.142",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.32",
    "jinja2>=3.1",
    "pygments>=2.19",
    "accessible-pygments",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=9.1",
]

[tool.uv.sources]
pyevp = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = ["error"]
