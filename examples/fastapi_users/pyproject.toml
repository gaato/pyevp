[project]
name = "pyevp-example-fastapi-users"
version = "0"
description = "fastapi-users registration that marks EVP-verified addresses as verified"
requires-python = ">=3.12"
dependencies = [
    "pyevp[dns,httpx2]",
    "aiosqlite>=0.22",
    "fastapi>=0.142",
    "fastapi-users[sqlalchemy]>=15",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=9.1",
]

[tool.uv.sources]
pyevp = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = ["error"]
