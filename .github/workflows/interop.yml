name: Chrome interop

# Runs the full EVP flow in headless Chrome against https://mail.pyevp.dev every night
# (interop/README.md). A stable failure opens or updates an "interop" issue; beta
# failures only show up in the run, as an early warning for the next stable.

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:

permissions: {}

jobs:
  chrome:
    name: chrome (${{ matrix.channel }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.channel == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-packages --group interop
      - id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: ${{ matrix.channel }}
          install-dependencies: true
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chrome's sandbox needs.
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the interop test
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          INTEROP_OUT: ${{ runner.temp }}/interop
        run: .venv/bin/python interop/chrome_evp.py
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-${{ matrix.channel }}
          path: ${{ runner.temp }}/interop
          retention-days: 14

  report:
    needs: chrome
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the interop issue
        run: |
          gh label create interop --color 1D76DB \
            --description "The nightly Chrome interop test failed" --force
          body="The nightly Chrome interop test failed: $RUN_URL"
          number=$(gh issue list --label interop --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Chrome interop test failed" --label interop --body "$body"
          fi
