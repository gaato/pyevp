name: Site image

# Builds ghcr.io/gaato/pyevp-site (examples/site).  The site host pulls :latest with
# podman auto-update, so a push to main that changes the image is a deploy.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-image.yml"
      - ".dockerignore"
      - "examples/site/**"
      - "examples/fastapi/app.py"
      - "examples/flask/app.py"
      - "examples/django/views.py"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/site-image.yml"
      - ".dockerignore"
      - "examples/site/**"
      - "examples/fastapi/app.py"
      - "examples/flask/app.py"
      - "examples/django/views.py"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: site-image-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/gaato/pyevp-site
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: examples/site/Containerfile
          build-args: BUILD_SHA=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pyevp-site
          cache-to: type=gha,mode=max,scope=pyevp-site
