name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs it on the tagged commit before publishing.
  workflow_call:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Install the examples too so that ty can resolve FastAPI / Django imports.
      - run: uv sync --locked --all-packages --all-extras --group interop
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync ty check
      # Offline checks of the Chrome interop script; the nightly run itself is interop.yml.
      - run: uv run --no-sync python -m pytest interop/test_chrome_evp.py

  test:
    name: test (py${{ matrix.python }}, extras=${{ matrix.extras }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        extras: [none, all]
        experimental: [false]
        locked: [true]
        include:
          # The workspace lock needs >=3.12 (Django in the examples), so 3.11
          # installs the library alone, outside the lock.
          - { python: "3.11", extras: none, experimental: false, locked: false }
          - { python: "3.11", extras: all, experimental: false, locked: false }
          # 3.15 is a release candidate; promote to required once 3.15.0 is out.
          - { python: "3.15", extras: none, experimental: true, locked: true }
          - { python: "3.15", extras: all, experimental: true, locked: true }
    env:
      PYTHON: ${{ matrix.python }}
      EXTRAS: ${{ matrix.extras }}
      LOCKED: ${{ matrix.locked }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: |
          if [ "$LOCKED" = true ]; then
            if [ "$EXTRAS" = all ]; then flags=--all-extras; else flags=; fi
            uv sync --locked --python "$PYTHON" $flags
          else
            if [ "$EXTRAS" = all ]; then target=".[all]"; else target="."; fi
            uv venv --python "$PYTHON"
            uv pip install "$target" pytest anyio
          fi
      - run: .venv/bin/pytest

  test-lowest:
    name: test (py3.11, lowest direct dependencies)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Outside the workspace lock, so that only the library's own lower bounds are tested.
      - name: Install lowest direct dependencies
        run: |
          uv venv --python 3.11
          uv pip install --resolution lowest-direct ".[all,cli,django]"
          uv pip install pytest anyio
      - run: .venv/bin/pytest

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --all-extras --group docs
      - run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html
      - run: uv run --no-sync sphinx-build -W --keep-going -D language=ja -b html docs docs/_build/ja

  examples:
    name: example (${{ matrix.example }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        example: [fastapi, fastapi_spa, flask, fastapi_users, authx, django, django_allauth, issuer_fastapi, issuer_django, site]
    env:
      EXAMPLE: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run --locked --directory "examples/$EXAMPLE" pytest

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
      - name: Smoke-test the wheel in a clean environment
        run: uv run --isolated --no-project --with dist/*.whl python -c "import pyevp, pyevp.testing"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
