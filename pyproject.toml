[project]
name = "PyEVP"
version = "0.2.0"
description = "Python library for the Email Verification Protocol (EVP): verify tokens as a relying party, or issue them for your own email domains"
readme = "README.md"
authors = [
    { name = "Gakuto Furuya", email = "g.furuya@gaato.net" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["email", "verification", "evp", "sd-jwt", "jose", "authentication"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "idna>=3.7",
    "joserfc>=1.7",
]

[project.optional-dependencies]
dns = [
    "dnspython>=2.7",
]
httpx = [
    "anyio>=4.5",
    "httpx>=0.28",
]
httpx2 = [
    "anyio>=4.5",
    "httpx2>=2.13",
]
all = [
    "pyevp[dns,httpx2,django,cli]",
]
cli = [
    "pyevp[dns,httpx2]",
    "typer>=0.27",
]
django = [
    "django>=4.2",
]

[project.scripts]
pyevp = "pyevp.__main__:main"

[project.urls]
Documentation = "https://docs.pyevp.dev/"
Repository = "https://github.com/gaato/pyevp"
Changelog = "https://github.com/gaato/pyevp/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "django>=6.1.1",
    "httpx2>=2.13",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
# The nightly Chrome interop test (interop/chrome_evp.py).
interop = [
    "websockets>=17.1",
]
docs = [
    "myst-parser>=5.1",
    "shibuya>=2026.7.12",
    "sphinx>=9.1",
    "sphinx-intl>=2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not network"]
markers = [
    "network: talks to real DNS / HTTPS endpoints (deselected by default)",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "C4", "PIE", "RET", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR"]
# Typer maps CLI options to parameters; commands are closures inside make_app().
"src/pyevp/cli/**" = ["PLR0915", "PLR0917"]
# Django's generated migration style.
"src/pyevp/contrib/django/migrations/**" = ["RUF012"]

[tool.uv.workspace]
members = ["examples/*"]
